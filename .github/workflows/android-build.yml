name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - run: npx cap add android || npx cap sync android
      - name: Update Android Version from package.json
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -p "const [ma, mi, pa] = require('./package.json').version.split('.').map(v => parseInt(v) || 0); ma * 10000 + mi * 100 + pa;")
          echo "Setting Android versionName: $VERSION_NAME, versionCode: $VERSION_CODE"
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "'"$VERSION_NAME"'"/g' android/app/build.gradle
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

