name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Setup Android Platform
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "android/app/build.gradle not found. Creating android platform..."
            rm -rf android
            npx cap add android
          else
            echo "android platform exists. Syncing..."
            npx cap sync android
          fi
      - name: Update Android Version from package.json
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=$(node -p "const [ma, mi, pa] = require('./package.json').version.split('.').map(v => parseInt(v) || 0); ma * 10000 + mi * 100 + pa;")
          echo "Setting Android versionName: $VERSION_NAME, versionCode: $VERSION_CODE"
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i -E 's/versionName "[^"]+"/versionName "'"$VERSION_NAME"'"/g' android/app/build.gradle
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

